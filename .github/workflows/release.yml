name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if cross-compiling)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bins
          else
            cargo build --release --target ${{ matrix.target }} --bins
          fi

      - name: Package binaries
        shell: bash
        run: |
          STAGING="fluxdb-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/fluxdb-server "$STAGING/"
          cp target/${{ matrix.target }}/release/fluxdb-cli "$STAGING/"
          cp target/${{ matrix.target }}/release/fluxdb-bench "$STAGING/"
          cp target/${{ matrix.target }}/release/fluxdb-dump "$STAGING/"
          cp target/${{ matrix.target }}/release/fluxdb-load "$STAGING/"
          cp target/${{ matrix.target }}/release/fluxdb-check "$STAGING/"
          cp fluxdb.toml "$STAGING/"
          cp README.md "$STAGING/"
          tar -czvf "fluxdb-${{ matrix.target }}.tar.gz" -C "$STAGING" .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: fluxdb-${{ matrix.target }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
